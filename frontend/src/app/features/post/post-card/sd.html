<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Quill Image & Video Upload Demo</title>
  <!-- Bootstrap -->
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->

  <!-- Quill -->
  <link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">

  <style>
    .ql-editor {
      min-height: 200px;
    }
  </style>
</head>
<body class="p-4">

<button
  class="btn btn-primary"
  data-bs-toggle="modal"
  data-bs-target="#createPostModal">
  Open Create Post Modal
</button>

<!-- Modal -->
<div class="modal fade" id="createPostModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Create Post</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input id="postTitle" class="form-control mb-3" placeholder="Post title..." />

        <!-- WYSIWYG -->
        <div id="editor" class="border rounded"></div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="submitPost()">Publish</button>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Quill JS -->
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>

<script>
  // Toolbar with image & video buttons
  var toolbarOptions = [
    [{ header: [1, 2, 3, false] }],
    ["bold", "italic", "underline"],
    ["image", "video"],
    [{ list: "ordered" }, { list: "bullet" }],
    ["clean"]
  ];

  // Initialize editor
  const quill = new Quill('#editor', {
    theme: 'snow',
    modules: {
      toolbar: {
        container: toolbarOptions,
        handlers: {
          image: imageHandler,
          video: videoHandler
        }
      }
    }
  });

  // ============================
  // IMAGE UPLOAD HANDLER
  // ============================
  function imageHandler() {
    let input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.click();

    input.onchange = async () => {
      let file = input.files[0];
      let reader = new FileReader();

      reader.onload = () => {
        const range = quill.getSelection();
        quill.insertEmbed(range.index, "image", reader.result);
      };

      reader.readAsDataURL(file); // Base64 (works offline)
    };
  }

  // ============================
  // VIDEO UPLOAD HANDLER
  // ============================
  function videoHandler() {
    let input = document.createElement("input");
    input.type = "file";
    input.accept = "video/*";
    input.click();

    input.onchange = async () => {
      let file = input.files[0];
      let reader = new FileReader();

      reader.onload = () => {
        const range = quill.getSelection();
        quill.insertEmbed(range.index, "video", reader.result);
      };

      reader.readAsDataURL(file);
    };
  }

  // ============================
  // SUBMIT POST
  // ============================
  function submitPost() {
    const title = document.getElementById("postTitle").value;
    const content = quill.root.innerHTML;

    alert("POST DATA:\n\n" + JSON.stringify({ title, content }, null, 2));
  }
</script>
</body>
</html>
