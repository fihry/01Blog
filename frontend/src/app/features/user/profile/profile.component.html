<div class="min-h-screen pt-5 mt-5" *ngIf="user; else loadingTpl">
    <div class="container-xl mx-auto py-5 px-4">
        <div class="app-widget-card p-5 max-w-2xl mx-auto shadow-sm">
            <div class="text-center mb-5">
                <div class="mb-3">
                    <div class="avatar-xl mx-auto">
                        <img *ngIf="user.avatarUrl" [src]="user.avatarUrl" alt="{{user.username}}"
                            class="rounded-circle img-fluid">
                        <div *ngIf="!user.avatarUrl"
                            class="avatar-placeholder rounded-circle d-flex align-items-center justify-content-center">
                            <span class="fs-1 fw-bold text-white">{{user.username.charAt(0).toUpperCase()}}</span>
                        </div>
                    </div>
                </div>
                <h1 class="text-3xl font-bold text-foreground">{{user.username}}</h1>
                <p class="text-muted-foreground" *ngIf="user.bio">{{user.bio}}</p>
            </div>
            <div class="d-flex justify-content-end m-5">
                <button *ngIf="!isOwnProfile()" class="btn w-20 py-2 fw-medium" [class.btn-primary]="!isFollowing"
                    [class.btn-outline-secondary]="user.followed" (click)="toggleFollow()">
                    {{ isFollowing ? 'Unfollow' : 'Follow' }}
                </button>
                <button *ngIf="isOwnProfile()" class="btn btn-outline-primary w-20  py-2" [routerLink]="['/settings']">
                    Edit Profile
                </button>
            </div>
            <div class="row g-3 text-center mb-5">
                <div class="col-4">
                    <div class="bg-accent rounded-3 p-3">
                        <p class="text-primary text-2xl font-bold m-0">{{user.postsCount || 0}}</p>
                        <p class="text-muted-foreground text-sm m-0">Posts</p>
                    </div>
                </div>
                <div class="col-4">
                    <div class="bg-accent rounded-3 p-3">
                        <p class="text-primary text-2xl font-bold m-0">{{user.followersCount || 0}}</p>
                        <p class="text-muted-foreground text-sm m-0">Followers</p>
                    </div>
                </div>
                <div class="col-4">
                    <div class="bg-accent rounded-3 p-3">
                        <p class="text-primary text-2xl font-bold m-0">{{user.followingCount || 0}}</p>
                        <p class="text-muted-foreground text-sm m-0">Following</p>
                    </div>
                </div>
            </div>



        </div>

        <!-- Posts List -->
        <div class="max-w-2xl mx-auto mt-5">
            <h3 class="font-bold text-xl mb-4">Posts</h3>
            <div *ngIf="posts.length === 0" class="text-center text-muted-foreground py-5">
                No posts yet.
            </div>
            <div *ngFor="let post of posts">
                <app-post-card [post]="post" (deletePost)="onDeletePost($event)">
                </app-post-card>
            </div>
        </div>

    </div>
</div>
<ng-template #loadingTpl>
    <div class="min-h-screen pt-5 mt-5 flex justify-center items-center">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</ng-template>

<style>
    .avatar-xl {
        width: 120px;
        height: 120px;
        margin: 0 auto;
        border: 4px solid #a9fd87;
        border-radius: 50%;
    }

    .avatar-xl img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .avatar-placeholder {
        width: 120px;
        height: 120px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
</style>
