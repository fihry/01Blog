<div class="min-h-screen pt-5 mt-5" *ngIf="user; else loadingTpl">
    <div class="container-m mx-auto py-5 px-4">
        <div class="app-widget-card p-5 max-w-2xl mx-auto shadow-sm">
            <div class="text-center mb-5">
                <div class="avatar-large-placeholder mx-auto mb-3">
                    <img *ngIf="user.avatar_url" [src]="user.avatar_url"
                        class="w-100 h-100 rounded-circle object-cover">
                    <span *ngIf="!user.avatar_url"
                        class="text-3xl text-muted-foreground">{{user.username.charAt(0).toUpperCase()}}</span>
                </div>
                <h1 class="text-3xl font-bold text-foreground">{{user.username}}</h1>
                <p class="text-muted-foreground" *ngIf="!user.bio">@{{user.username}}</p>
                <p class="text-muted-foreground" *ngIf="user.bio">{{user.bio}}</p>
            </div>
            <div class="row g-3 text-center mb-5">
                <div class="col-4">
                    <div class="bg-accent rounded-3 p-3">
                        <p class="text-primary text-2xl font-bold m-0">{{user.posts_count || 0}}</p>
                        <p class="text-muted-foreground text-sm m-0">Posts</p>
                    </div>
                </div>
                <div class="col-4">
                    <div class="bg-accent rounded-3 p-3">
                        <p class="text-primary text-2xl font-bold m-0">{{user.followers_count || 0}}</p>
                        <p class="text-muted-foreground text-sm m-0">Followers</p>
                    </div>
                </div>
                <div class="col-4">
                    <div class="bg-accent rounded-3 p-3">
                        <p class="text-primary text-2xl font-bold m-0">{{user.following_count || 0}}</p>
                        <p class="text-muted-foreground text-sm m-0">Following</p>
                    </div>
                </div>
            </div>

            <button *ngIf="!isOwnProfile()" class="btn w-100 py-2 fw-medium" [class.btn-primary]="!isFollowing"
                [class.btn-outline-secondary]="isFollowing" (click)="toggleFollow()">
                {{ isFollowing ? 'Unfollow' : 'Follow' }}
            </button>
            <button *ngIf="isOwnProfile()" class="btn btn-outline-primary w-100 py-2 fw-medium"
                [routerLink]="['/settings']">
                Edit Profile
            </button>
        </div>

        <!-- Posts List -->
        <div class="max-w-2xl mx-auto mt-5">
            <h3 class="font-bold text-xl mb-4">Posts</h3>
            <div *ngIf="posts.length === 0" class="text-center text-muted-foreground py-5">
                No posts yet.
            </div>
            <div *ngFor="let post of posts">
                <app-post-card [post]="post" (deletePost)="onDeletePost($event)">
                </app-post-card>
            </div>
        </div>

    </div>
</div>
<ng-template #loadingTpl>
    <div class="min-h-screen pt-5 mt-5 flex justify-center items-center">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</ng-template>
