<nav class="navbar navbar-base navbar-expand-md">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <span class="navbar-brand">ZeroOneBlog</span>
        
        <div class="d-flex d-md-none align-items-center">
             <ng-container *ngIf="isAuthenticated$ | async">
                <button class="nav-link px-2 py-1 rounded-2 focus:outline-none me-2">
                    <i class="bi bi-bell h-6 w-6"></i>
                </button>
             </ng-container>
            
            <button (click)="toggleTheme()" class="nav-link px-2 py-1 rounded-2 focus:outline-none me-2">
                <i *ngIf="isDarkMode" class="bi bi-moon h-6 w-6"></i>
                <i *ngIf="!isDarkMode" class="bi bi-sun h-6 w-6"></i>
            </button>

            <button class="navbar-toggler" type="button" aria-controls="navbarContent"
                [attr.aria-expanded]="isMobileMenuOpen" aria-label="Toggle navigation" (click)="toggleMobileMenu()">
                <i *ngIf="!isMobileMenuOpen" class="bi bi-list h-6 w-6"></i>
                <i *ngIf="isMobileMenuOpen" class="bi bi-x h-6 w-6"></i>
            </button>
        </div>


        <div class="navbar-collapse" [class.collapse]="!isMobileMenuOpen" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <ng-container *ngIf="isAuthenticated$ | async">
                    <li class="nav-item">
                        <a routerLink="/feed" routerLinkActive="active" class="nav-link px-3 py-2 text-sm font-medium"
                            (click)="closeMenus()">Feed</a>
                    </li>
                    <li *ngIf="isAdmin" class="nav-item">
                        <a routerLink="/admin" routerLinkActive="active" class="nav-link px-3 py-2 text-sm font-medium"
                            (click)="closeMenus()">Admin</a>
                    </li>
                </ng-container>
            </ul>

            <ul class="navbar-nav align-items-center d-none d-md-flex">

                <li class="nav-item me-2" *ngIf="isAuthenticated$ | async">
                    <button class="nav-link px-2 py-1 rounded-2 focus:outline-none">
                        <i class="bi bi-bell h-6 w-6"></i>
                    </button>
                </li>

                <li class="nav-item me-2">
                    <button (click)="toggleTheme()" class="nav-link px-2 py-1 rounded-2 focus:outline-none">
                        <i *ngIf="isDarkMode" class="bi bi-moon h-6 w-6"></i>
                        <i *ngIf="!isDarkMode" class="bi bi-sun h-6 w-6"></i>
                    </button>
                </li>

                <ng-container *ngIf="isAuthenticated$ | async; else authButtons">
                    <li class="nav-item" ngbDropdown placement="bottom-end">
                        <a ngbDropdownToggle class="nav-link dropdown-toggle d-flex align-items-center" role="button"
                            id="navbarDropdown2">
                            <img class="avatar h-8 w-8 rounded-full object-cover me-2"
                                [src]="currentUserDisplayAvatarUrl$ | async" alt="User Avatar">
                            <span class="text-sm font-medium d-none d-lg-inline">{{ currentUserDisplayName$ | async
                                }}</span>
                        </a>

                        <div ngbDropdownMenu aria-labelledby="navbarDropdown2"
                            class="dropdown-menu-custom dropdown-menu-end py-2 shadow-lg">
                            <a ngbDropdownItem (click)="navigateTo('/profile')" class="text-sm cursor-pointer"><i
                                    class="bi bi-person me-2"></i>Your Profile</a>
                            <a *ngIf="isAdmin" ngbDropdownItem (click)="navigateTo('/admin')"
                                class="text-sm cursor-pointer"><i class="bi bi-speedometer2 me-2"></i>Admin
                                Dashboard</a>
                            <a ngbDropdownItem (click)="navigateTo('/settings')" class="text-sm cursor-pointer"><i
                                    class="bi bi-gear me-2 "></i>Settings</a>
                            <div class="dropdown-divider my-1"></div>
                            <button ngbDropdownItem (click)="logout()" class="text-sm"><i
                                    class="bi bi-box-arrow-right me-2"></i>Sign out</button>
                        </div>
                    </li>
                </ng-container>

                <ng-template #authButtons>
                    <li class="nav-item">
                        <a routerLink="/login" 
                           class="btn btn-primary btn-primary-small text-sm font-medium px-3 py-2 rounded-md"
                           (click)="closeMenus()">Sign In</a>
                    </li>
                </ng-template>
            </ul>
        </div>
    </div>
</nav>
