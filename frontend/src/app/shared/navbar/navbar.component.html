<nav class="navbar navbar-base navbar-expand-md fixed-top">
    <div class="container-xl d-flex justify-content-between align-items-center">
        <a class="navbar-brand font-bold text-2xl tracking-tighter text-foreground" routerLink="/">ZeroOne<span
                class="text-primary">.</span></a>

        <div class="d-flex d-md-none align-items-center gap-2">
            <ng-container *ngIf="isAuthenticated$ | async">
                <app-notification-bell></app-notification-bell>
            </ng-container>

            <button (click)="toggleTheme()" class="btn btn-ghost p-2 d-flex align-items-center justify-content-center"
                style="width: 2.5rem; height: 2.5rem; border-radius: 50%;">
                <i *ngIf="isDarkMode" class="bi bi-moon h-6 w-6"></i>
                <i *ngIf="!isDarkMode" class="bi bi-sun h-6 w-6"></i>
            </button>

            <button class="navbar-toggler border-0 p-2" type="button" aria-controls="navbarContent"
                [attr.aria-expanded]="isMobileMenuOpen" aria-label="Toggle navigation" (click)="toggleMobileMenu()">
                <i *ngIf="!isMobileMenuOpen" class="bi bi-list h-8 w-8"></i>
                <i *ngIf="isMobileMenuOpen" class="bi bi-x h-8 w-8"></i>
            </button>
        </div>


        <div class="navbar-collapse collapse" [class.show]="isMobileMenuOpen" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 align-items-md-center">
                <ng-container *ngIf="isAuthenticated$ | async">
                    <li class="nav-item">
                        <a routerLink="/feed" routerLinkActive="active" class="nav-link px-3 py-2 text-sm font-medium"
                            (click)="closeMenus()">
                            <i class="bi bi-house-door me-2"></i>Feed
                        </a>
                    </li>
                    <li class="nav-item">
                        <a routerLink="/users" routerLinkActive="active" class="nav-link px-3 py-2 text-sm font-medium"
                            (click)="closeMenus()">
                            <i class="bi bi-people me-2"></i>Users
                        </a>
                    </li>
                    <li *ngIf="isAdmin" class="nav-item">
                        <a routerLink="/admin" routerLinkActive="active" class="nav-link px-3 py-2 text-sm font-medium"
                            (click)="closeMenus()">
                            <i class="bi bi-speedometer2 me-2"></i>Admin
                        </a>
                    </li>
                </ng-container>
            </ul>

            <ul class="navbar-nav align-items-center d-none d-md-flex gap-2">

                <li class="nav-item" *ngIf="isAuthenticated$ | async">
                    <app-notification-bell></app-notification-bell>
                </li>
                <li class="nav-item" *ngIf="isAuthenticated$ | async">
                    <button
                        class="btn btn-ghost p-2 d-flex align-items-center justify-content-center text-muted-foreground hover:text-foreground"
                        style="width: 2.5rem; height: 2.5rem; border-radius: 50%;">
                        <i class="bi bi-chat-dots h-6 w-6"></i>
                    </button>
                </li>

                <li class="nav-item">
                    <button (click)="toggleTheme()"
                        class="btn btn-ghost p-2 d-flex align-items-center justify-content-center text-muted-foreground hover:text-foreground"
                        style="width: 2.5rem; height: 2.5rem; border-radius: 50%;">
                        <i *ngIf="isDarkMode" class="bi bi-moon h-6 w-6"></i>
                        <i *ngIf="!isDarkMode" class="bi bi-sun h-6 w-6"></i>
                    </button>
                </li>

                <ng-container *ngIf="isAuthenticated$ | async; else authButtons">
                    <li class="nav-item ms-2" ngbDropdown placement="bottom-end">
                        <a ngbDropdownToggle class="nav-link dropdown-toggle d-flex align-items-center p-0 no-caret"
                            role="button" id="navbarDropdown2">
                            <img class="avatar h-8 w-8 rounded-circle object-cover border border-muted"
                                [src]="currentUserDisplayAvatarUrl$ | async" alt="User Avatar">
                        </a>

                        <div ngbDropdownMenu aria-labelledby="navbarDropdown2"
                            class="dropdown-menu-custom dropdown-menu-end py-2 shadow-lg mt-2">

                            <div class="px-3 py-2 border-bottom border-muted mb-2">
                                <p class="text-sm font-medium m-0">{{ currentUserDisplayName$ | async }}</p>
                                <p class="text-xs text-muted-foreground m-0">Signed in</p>
                            </div>

                            <a ngbDropdownItem (click)="navigateTo('/profile')"
                                class="text-sm cursor-pointer py-2 px-3 d-flex align-items-center">
                                <i class="bi bi-person me-2 opacity-75"></i>Your Profile
                            </a>
                            <a *ngIf="isAdmin" ngbDropdownItem (click)="navigateTo('/admin')"
                                class="text-sm cursor-pointer py-2 px-3 d-flex align-items-center">
                                <i class="bi bi-speedometer2 me-2 opacity-75"></i>Admin Dashboard
                            </a>
                            <a ngbDropdownItem (click)="navigateTo('/settings')"
                                class="text-sm cursor-pointer py-2 px-3 d-flex align-items-center">
                                <i class="bi bi-gear me-2 opacity-75"></i>Settings
                            </a>
                            <div class="dropdown-divider my-1"></div>
                            <button ngbDropdownItem (click)="logout()"
                                class="text-sm py-2 px-3 d-flex align-items-center text-danger">
                                <i class="bi bi-box-arrow-right me-2 opacity-75"></i>Sign out
                            </button>
                        </div>
                    </li>
                </ng-container>

                <ng-template #authButtons>
                    <li class="nav-item ms-2">
                        <a routerLink="/login"
                            class="btn btn-primary btn-sm text-sm font-medium px-4 py-2 rounded-pill shadow-sm"
                            (click)="closeMenus()">Sign In</a>
                    </li>
                </ng-template>
            </ul>
        </div>
    </div>
</nav>
