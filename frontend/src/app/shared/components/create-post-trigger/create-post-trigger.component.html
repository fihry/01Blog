<div class="app-widget-card mb-4 p-4 cursor-pointer" (click)="openModal()" *ngIf="!isOpen && !editMode" style="cursor: pointer;">
  <div class="d-flex align-items-start gap-3">
    <a class="avatar-placeholder me-3" style="width: 50px; height: 50px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
      <img *ngIf="avatar$ | async as avatar" [src]="avatar" class="w-100 h-100 rounded-circle object-cover">
    </a>
    <div class="flex-grow-1">
      <div class="bg-muted rounded-3 px-4 py-3 text-muted-foreground text-sm">
        What's on your mind? Start a post...
      </div>
    </div>
  </div>
</div>
