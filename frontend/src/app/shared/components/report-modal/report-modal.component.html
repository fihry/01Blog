<div class="modal-backdrop fade" [class.show]="isOpen" *ngIf="isOpen" (click)="onClose()"></div>

<div class="modal fade" [class.show]="isOpen" [class.d-block]="isOpen" tabindex="-1" *ngIf="isOpen">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <!-- Modal Header -->
            <div class="modal-header border-0">
                <h5 class="modal-title fw-bold">
                    <i class="bi bi-flag-fill text-danger me-2"></i>
                    Report {{ reportType }}
                </h5>
                <button type="button" class="btn-close" (click)="onClose()"></button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <p class="text-muted mb-4">
                    Help us understand what's wrong with this {{ reportType }}. Your report is anonymous.
                </p>

                <!-- Predefined Reasons -->
                <div class="mb-4">
                    <label class="form-label fw-semibold">Select a reason</label>
                    <div class="d-flex flex-column gap-2">
                        <div class="form-check" *ngFor="let option of reportOptions">
                            <input class="form-check-input" type="radio" [id]="option.value" [value]="option.value"
                                [(ngModel)]="selectedReason" name="reportReason">
                            <label class="form-check-label" [for]="option.value">
                                {{ option.label }}
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Custom Reason Textarea -->
                <div *ngIf="selectedReason === 'other'">
                    <label class="form-label fw-semibold">Please provide more details</label>
                    <textarea class="form-control" rows="4" placeholder="Describe the issue..."
                        [(ngModel)]="customReason" maxlength="500"></textarea>
                    <div class="form-text text-end">
                        {{ customReason.length }}/500
                    </div>
                </div>

                <!-- Warning Message -->
                <div class="alert alert-warning d-flex align-items-start gap-2 mt-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <small>False reports may result in action being taken on your account.</small>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-secondary" (click)="onClose()">
                    Cancel
                </button>
                <button type="button" class="btn btn-danger" [disabled]="!isValidReport || isSubmitting"
                    (click)="onSubmit()">
                    <span *ngIf="!isSubmitting">
                        <i class="bi bi-flag me-2"></i>Submit Report
                    </span>
                    <span *ngIf="isSubmitting">
                        <span class="spinner-border spinner-border-sm me-2"></span>
                        Submitting...
                    </span>
                </button>
            </div>
        </div>
    </div>
</div>
