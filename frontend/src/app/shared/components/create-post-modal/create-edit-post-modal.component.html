<!-- Inline trigger card (only show when not in edit mode) -->
<div 
  class="app-widget-card mb-4 p-4 cursor-pointer" 
  (click)="openOverlay()" 
  *ngIf="!isOpen && !editMode"
  style="cursor: pointer;">
  <div class="d-flex align-items-start gap-3">
    <div class="avatar-placeholder flex-shrink-0"></div>
    <div class="flex-grow-1">
      <div class="bg-muted rounded-3 px-4 py-3 text-muted-foreground text-sm">
        What's on your mind? Start a post...
      </div>
    </div>
  </div>
</div>

<!-- Centered modal overlay -->
<div
  *ngIf="isOpen"
  class="modal-overlay d-flex align-items-center justify-content-center"
  style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1050;"
  (click)="closeOverlay()"
>
  <div
    class="app-widget-card w-100 shadow-lg d-flex flex-column animate-in"
    style="max-width: 900px; max-height: 90vh; overflow: hidden;"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center px-4 py-3 border-bottom">
      <div class="d-flex align-items-center gap-2">
        <i class="bi" [class.bi-pencil-square]="editMode" [class.bi-file-earmark-plus]="!editMode"></i>
        <span class="fw-semibold">{{ editMode ? 'Edit Post' : 'Create Post' }}</span>
      </div>
      <button 
        type="button" 
        class="btn-close" 
        aria-label="Close" 
        (click)="closeOverlay()" 
        [disabled]="isSubmitting">
      </button>
    </div>

    <!-- Form -->
    <form class="d-flex flex-column flex-grow-1" (ngSubmit)="onSubmit()">

      <!-- Toolbar -->
      <div class="px-4 py-2 border-bottom d-flex align-items-center gap-2 flex-wrap bg-muted">
        <button type="button" class="btn btn-ghost btn-sm" (click)="applyFormat('h1')" title="Heading 1">
          <strong>H1</strong>
        </button>
        <button type="button" class="btn btn-ghost btn-sm" (click)="applyFormat('h2')" title="Heading 2">
          <strong>H2</strong>
        </button>
        <button type="button" class="btn btn-ghost btn-sm" (click)="applyFormat('bold')" title="Bold">
          <strong>B</strong>
        </button>
        <button type="button" class="btn btn-ghost btn-sm" (click)="applyFormat('italic')" title="Italic">
          <em>I</em>
        </button>
        <button type="button" class="btn btn-ghost btn-sm" (click)="applyFormat('bullet')" title="Bullet List">
          • List
        </button>

        <div class="vr mx-2"></div>

        <label class="btn btn-ghost btn-sm d-flex align-items-center gap-2 mb-0" style="cursor: pointer;">
          <i class="bi bi-image text-primary"></i>
          <span class="text-xs">Add Media</span>
          <input 
            type="file" 
            class="d-none" 
            multiple 
            accept="image/*,video/*" 
            (change)="onFilesSelected($event)" 
          />
        </label>

        <div class="ms-auto text-xs text-muted-foreground">
          {{ content.length }} characters
        </div>
      </div>

      <!-- Editor -->
      <div class="px-4 py-3 flex-grow-1 overflow-auto">
        <input
          type="text"
          placeholder="Post title..."
          class="form-control border-0 fs-3 fw-bold px-0 mb-3"
          style="box-shadow: none;"
          [(ngModel)]="title"
          name="title"
          required
          minlength="3"
        />

        <div
          #editor
          contenteditable="true"
          class="form-control h-100 border-0 px-0"
          placeholder="Share your thoughts..."
          style="box-shadow: none; min-height: 300px; max-height: 400px; overflow-y: auto;"
          (input)="updateContent()"
        ></div>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="alert alert-danger mb-0 mx-4 mb-2 py-2 px-3 text-sm d-flex align-items-center gap-2">
        <i class="bi bi-exclamation-triangle-fill"></i>
        {{ errorMessage }}
      </div>

      <!-- Footer -->
      <div class="px-4 py-3 border-top d-flex justify-content-between align-items-center">
        <div class="text-xs text-muted-foreground">
          <i class="bi bi-info-circle me-1"></i>
          {{ editMode ? 'Changes will be saved to your post.' : 'Your post will be visible to your followers.' }}
        </div>
        <div class="d-flex gap-2">
          <button 
            type="button" 
            class="btn btn-outline-secondary btn-sm" 
            (click)="closeOverlay()" 
            [disabled]="isSubmitting">
            Cancel
          </button>
          <button 
            type="submit" 
            class="btn btn-primary btn-sm" 
            [disabled]="isSubmitting || !title.trim() || !content.trim()">
            <span *ngIf="!isSubmitting">
              <i class="bi me-1" [class.bi-check-circle]="editMode" [class.bi-send]="!editMode"></i>
              {{ editMode ? 'Update' : 'Publish' }}
            </span>
            <span *ngIf="isSubmitting" class="d-flex align-items-center gap-2">
              <span class="spinner-border spinner-border-sm" role="status"></span>
              {{ editMode ? 'Updating...' : 'Publishing...' }}
            </span>
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
