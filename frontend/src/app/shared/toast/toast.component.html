<div class="toast-container position-fixed bottom-0 end-0 p-4 shadcn-toast-root">
  <div
    *ngFor="let toast of toasts$ | async"
    class="shadcn-toast"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
    [ngClass]="toast.type"
  >
    <!-- Icon -->
    <div class="shadcn-toast-icon">
      <i class="bi bi-check-circle-fill" *ngIf="toast.type === 'success'"></i>
      <i class="bi bi-x-circle-fill" *ngIf="toast.type === 'error'"></i>
      <i class="bi bi-info-circle-fill" *ngIf="toast.type === 'info'"></i>
      <i class="bi bi-exclamation-triangle-fill" *ngIf="toast.type === 'warning'"></i>
    </div>

    <!-- Message -->
    <div class="shadcn-toast-content">
      {{ toast.message }}
    </div>

    <!-- Close -->
    <button
      class="shadcn-toast-close"
      (click)="remove(toast.id)"
      aria-label="Close"
    >
      ✕
    </button>
  </div>
</div>
